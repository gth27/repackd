[package]
name = "repackd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.3"
gilrs = "0.11.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2.191"
lzma-rs = "0.3.0"
md-5 = "0.11.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
